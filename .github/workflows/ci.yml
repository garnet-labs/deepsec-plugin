name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build, test, and record runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start Garnet Runtime Review
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Type-check test contracts
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Run observable demo workload
        run: node demo/runtime-demo.mjs

      - name: Verify built artifacts
        run: |
          test -f dist/index.js
          test -f dist/correlate.js
          test -f dist/garnet-client.js
